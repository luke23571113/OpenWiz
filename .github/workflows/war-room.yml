name: War room

# The War room, redrawn every hour on the branch `war-room` (WR9, #2411), like the
# board: the page as a picture, a one-column phone picture and the saved samples.
# Bookmark: https://github.com/jparker2006/ClosedWiz/tree/war-room

on:
  # An hourly CloudRoom loop dispatches this; the cron is a thin backup, every 6 hours.
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/war-room/**'
      - 'tools/privacy-check/**'
      - '.github/workflows/war-room.yml'

permissions:
  contents: read

jobs:
  proof:
    # Pull requests only: publish.sh runs the same tests before it publishes, so a dispatched or
    # scheduled run is one job, one billed minute.
    if: github.event_name == 'pull_request'
    # GitHub-hosted on purpose, never vars.CI_RUNS_ON: the charge shows in GitHub's own billing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        run: sh tools/ci-bench/python.sh
      - name: Node for the chart build (WRD2)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: The locked chart build (WRD2; build only)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/war-room
      - name: The War room publish and gather tests
        run: |
          python3 -I tools/war-room/test_publish.py
          python3 -I tools/war-room/test_gather.py
      - name: The War room health and v2 history proofs (WRD1)
        # Runs even when an earlier step failed, so the health proofs always report.
        if: ${{ !cancelled() }}
        run: python3 -I tools/war-room/test_health.py
      - name: The War room chart proofs (WRD2)
        # Runs even when an earlier step failed, so the chart proofs always report.
        if: ${{ !cancelled() }}
        run: python3 -I tools/war-room/test_charts.py
      - name: The War room v3 page proofs (WRD3)
        # Runs even when an earlier step failed, so the page proofs always report.
        if: ${{ !cancelled() }}
        run: python3 -I tools/war-room/test_page_design.py

  preview:
    # A pull request ticks and draws on an empty private history, and publishes nothing.
    needs: proof
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        run: sh tools/ci-bench/python.sh
      - name: Node for the chart build (WRD2)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: The locked chart build (WRD2; build only)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/war-room
      - name: Tick and draw, no publish
        run: python3 -I tools/war-room/publish.py preview --out "$RUNNER_TEMP/war-room" --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  publish:
    # No `needs: proof`: publish.sh runs test_publish.py first, and a failed test publishes nothing.
    # Default off: nothing publishes, scheduled or dispatched, until the orchestrator activates it
    # with the repository variable WAR_ROOM_PUBLISH=on (tools/war-room/README.md, Publish).
    if: vars.WAR_ROOM_PUBLISH == 'on' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A cap, not a budget: gather.py's read-only gh reads add to the one-minute publish.
    timeout-minutes: 15
    # Only this job writes, and publish.py pushes only refs/heads/war-room. The read scopes are
    # gather.py's (WR10): it fetches `board` and `ci-benchmarks` and runs read-only gh queries.
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    concurrency:
      group: war-room-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        run: sh tools/ci-bench/python.sh
      - name: Node for the chart build (WRD2)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: The locked chart build (WRD2; build only; without it the chart build refuses and nothing publishes)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/war-room
      - name: Tests, then gather the sources (reads only), tick, draw and publish only war-room
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          sh tools/war-room/publish.sh "https://github.com/${{ github.repository }}.git" \
            --gather "${{ github.repository }}" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
